name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pillow (optional image dependency)
        run: python -m pip install Pillow
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-test (text engine, no dependencies)
        run: |
          bin/asciiart text "CI" -f standard
          bin/asciiart image examples/valley.png -w 60 --format blocks
          bin/asciiart demo --seed 1 > /dev/null
